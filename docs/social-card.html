<!doctype html>
<!-- Sharing image source. Serve the repository root locally, open /docs/social-card.html at 1200×630 and screenshot it to assets/social.png. -->
<html lang="en-GB"><head><meta charset="utf-8"><title>Social card</title><link rel="stylesheet" href="/styles.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#4443c5;color:#fff;position:relative}
.card{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top img.fwc{width:250px}
.endorse{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}
.endorse img{width:130px}
h1{margin-top:auto;max-width:740px;font-size:82px;line-height:.92;letter-spacing:-.06em;color:#fff}
h1 .handwritten{display:block;color:#d7ff3f;font-size:1.12em;transform:rotate(-2.5deg);transform-origin:left;width:fit-content;margin-top:.08em}
p{margin:26px 0 0;font-size:24px;color:#ecebff}
.sticker{position:absolute;right:80px;bottom:90px;width:230px;height:230px;border-radius:50%;background:#d7ff3f;color:#0b0f2e;display:grid;place-items:center;align-content:center;text-align:center;transform:rotate(-10deg)}
.sticker strong{font-size:96px;line-height:.85;letter-spacing:-.06em}
.sticker span{font-size:17px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;max-width:150px;line-height:1.2;margin-top:8px}
.dot{position:absolute;right:92px;bottom:330px;width:46px;height:46px;border-radius:50%;background:#ff7a00}
</style></head>
<body><div class="card">
<div class="top"><img class="fwc" src="/assets/logo-white.png" alt=""><div class="endorse">An initiative by <img src="/assets/gotter-logo-white.webp" alt=""></div></div>
<h1>A professional website. <span class="handwritten">Free to build.</span></h1>
<p>No upfront development fee. Monthly costs apply.</p>
</div><span class="dot"></span><div class="sticker"><strong>£0</strong><span>upfront build fee</span></div></body></html>
